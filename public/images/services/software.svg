    <circle cx="540" cy="365" r="9" fill="#CFEAE0"/>

    <rect x="590" y="325" width="302" height="160" rx="20" fill="#FFFFFF"/>
    <text x="617" y="364" class="p1">ESTADO DEL SISTEMA</text>
    <circle cx="634" cy="421" r="12" fill="#CFEAE0"/>

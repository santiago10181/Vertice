    <path d="M356 664L430 612L501 623L571 565L638 584L711 536L780 562L848 526" stroke="#2F4A63" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="571" cy="565" r="10" fill="#CFEAE0" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="708" y="586" width="139" height="75" rx="16" fill="url(#accent)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" fill="none">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="890" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131B2B"/>
      <stop offset="1" stop-color="#2F4A63"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#CFEAE0" fill-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="0" y="0" width="1000" height="880" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#09111C" flood-opacity="0.36"/>
    </filter>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 700; fill: #F7FBF9; }
      .eyebrow { font-family: Arial, Helvetica, sans-serif; font-size: 18px; letter-spacing: 2px; font-weight: 600; fill: #CFEAE0; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #F7FBF9; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #C5D6DE; }
    </style>
  </defs>

  <rect width="1000" height="880" fill="url(#bg)"/>
  <rect width="1000" height="880" fill="url(#dots)"/>
  <text x="64" y="84" class="eyebrow">AUTOMATION / CONNECTED FLOWS</text>
  <text x="64" y="145" class="title">De tareas repetitivas a flujos confiables.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="338" width="216" height="194" rx="24" fill="#1C2B40" stroke="#CFEAE0" stroke-opacity="0.18"/>
    <circle cx="132" cy="382" r="14" fill="#CFEAE0"/>
    <text x="163" y="389" class="label">Entrada</text>
    <text x="125" y="438" class="body">Formulario, email o API</text>
    <rect x="124" y="460" width="151" height="9" rx="4.5" fill="#506175"/>
    <rect x="124" y="484" width="112" height="9" rx="4.5" fill="#506175"/>

    <rect x="390" y="297" width="220" height="278" rx="26" fill="#223549" stroke="#CFEAE0" stroke-opacity="0.22"/>
    <circle cx="500" cy="376" r="40" fill="#CFEAE0" fill-opacity="0.17"/>
    <path d="M484 376L497 389L520 360" stroke="#CFEAE0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500" y="453" text-anchor="middle" class="label">Procesar</text>
    <text x="500" y="484" text-anchor="middle" class="body">Reglas, validación e IA</text>
    <rect x="438" y="515" width="123" height="8" rx="4" fill="#5B7184"/>

    <rect x="692" y="338" width="216" height="194" rx="24" fill="#1C2B40" stroke="#CFEAE0" stroke-opacity="0.18"/>
    <circle cx="732" cy="382" r="14" fill="#CFEAE0"/>
    <text x="763" y="389" class="label">Acción</text>
    <text x="725" y="438" class="body">Notificación, CRM o ticket</text>
    <rect x="724" y="460" width="151" height="9" rx="4.5" fill="#506175"/>
    <rect x="724" y="484" width="118" height="9" rx="4.5" fill="#506175"/>

    <rect x="349" y="620" width="302" height="92" rx="20" fill="#CFEAE0"/>
    <circle cx="392" cy="666" r="12" fill="#2F4A63"/>
    <text x="419" y="672" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;fill:#131B2B">Flujo completado</text>
  </g>

  <g stroke="#CFEAE0" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10" stroke-opacity="0.7">
    <path d="M308 435H390"/>
    <path d="M610 435H692"/>
    <path d="M500 575V619"/>
  </g>
  <g fill="#CFEAE0">
    <circle cx="349" cy="435" r="8"/>
    <circle cx="651" cy="435" r="8"/>
    <circle cx="500" cy="598" r="8"/>
  </g>
</svg>

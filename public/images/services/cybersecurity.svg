  <circle cx="500" cy="438" r="280" fill="url(#glow)"/>

  <text x="64" y="84" class="eyebrow">CYBERSECURITY / TRUST</text>
  <text x="64" y="146" class="title">Protección y claridad en cada capa.</text>


<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" fill="none">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="890" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131B2B"/>
      <stop offset="1" stop-color="#2F4A63"/>
    </linearGradient>
    <linearGradient id="mintLine" x1="188" y1="151" x2="792" y2="654" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFEAE0"/>
      <stop offset="1" stop-color="#7FB8AA"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 430) rotate(90) scale(240)">
      <stop stop-color="#CFEAE0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#CFEAE0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50" y="-50" width="1100" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#0A111D" flood-opacity="0.42"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">

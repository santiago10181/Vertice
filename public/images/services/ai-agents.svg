  <circle cx="500" cy="430" r="250" fill="url(#coreGlow)"/>
  <path d="M72 705C233 611 344 694 502 605C662 516 762 334 929 377" stroke="#CFEAE0" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M96 742C275 650 393 742 540 667C687 592 767 458 922 481" stroke="#CFEAE0" stroke-opacity="0.08" stroke-width="2"/>

  <text x="64" y="84" class="eyebrow">AI AGENTS / ORCHESTRATION</text>
  <text x="64" y="146" class="title">Automatización inteligente, coordinada.</text>

  <g stroke="url(#mintLine)" stroke-width="4">
